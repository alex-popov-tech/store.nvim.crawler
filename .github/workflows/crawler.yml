name: Repository Crawler
on:
  schedule:
    # Run nightly at 2:00 UTC (~4-5 AM Kyiv time)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering
jobs:
  crawl:
    name: Crawl nvim plugin repositories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install dependencies
        run: npm install
      - name: Run crawler
        env:
          LOG_LEVEL: info
          GITHUBB_TOKEN: ${{ secrets.GITHUBB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: npm run crawling
      - name: Upload crawl results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crawling-results
          path: output/
          retention-days: 3
      - name: Create nightly release
        run: |
          TAG="nightly-$(date -u +%Y-%m-%d)"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            output/db_minified.json#db.json \
            output/lazy_db_minified.json#lazy.nvim.json \
            output/vimpack_db_minified.json#vim.pack.json \
            output/verificator_cache.json#verification_cache.json \
            output/installation_cache.json#installation_cache.json \
            --title "Nightly $TAG" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUBB_TOKEN }}
